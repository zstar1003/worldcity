<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f1f2ea" />
    <meta name="description" content="在浏览器中，走进北京、上海、广州与深圳。原始建筑几何，第一人称与第三人称城市漫游。" />
    <title>在城 · City Walk</title>
  </head>
  <body>
    <div id="app">
      <div id="viewport" aria-label="可交互三维城市，鼠标拖动观察，WASD 移动"></div>
      <header class="topbar">
        <a class="brand" href="#shenzhen" aria-label="在城，返回深圳"><span class="brand-mark">在</span><span>在城<small>CITY WALK</small></span></a>
        <nav id="city-nav" aria-label="选择城市"></nav>
        <div class="top-actions"><span class="local-badge"><i></i>城市漫游</span><button id="help-button" class="icon-button" title="操作说明" aria-label="操作说明">?</button><button id="fullscreen-button" class="icon-button" title="全屏" aria-label="全屏">⛶</button></div>
      </header>
      <aside class="scene-info">
        <div class="eyebrow"><span id="city-number">04 / 04</span><span>步入一座城市</span></div>
        <h1 id="city-title">深圳<span>SHENZHEN</span></h1>
        <p id="city-description">在摩天楼与街道之间，重新发现城市。</p>
        <div class="location-line"><span class="location-dot"></span><span id="location-label">福田中心区</span><span class="line"></span><span id="altitude">— m</span></div>
      </aside>
      <aside class="places-panel">
        <div class="panel-heading"><span>从这里出发</span><span class="small-label">EXPLORE</span></div>
        <div id="places"></div>
        <button id="overview-button" class="overview-link"><span>↗</span> 返回城市全景</button>
      </aside>
      <div id="crosshair" aria-hidden="true"></div>
      <div id="walk-hint" class="walk-hint" hidden>点击画面，开始环视<span>W A S D 移动 · Shift 加速 · Esc 释放鼠标</span></div>
      <footer class="bottom-bar">
        <div class="mode-switch" role="group" aria-label="游览视角">
          <button data-mode="orbit" class="active" aria-pressed="true"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-25 12 12)"/><circle cx="12" cy="12" r="5"/></svg><span>自由观察</span></button>
          <button data-mode="first" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><span>第一人称</span></button>
          <button data-mode="third" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="3"/><path d="M6 13c0-4 12-4 12 0v4H6Z M9 17v5m6-5v5"/></svg><span>第三人称</span></button>
        </div>
        <div class="view-options"><label>步速<select id="speed-select" aria-label="移动速度"><option value="1.8">漫步</option><option value="5" selected>快走</option><option value="18">快速探索</option></select></label><span class="option-divider"></span><label>显示<select id="quality-select" aria-label="显示质量"><option value="high" selected>原生高清</option><option value="balanced">流畅显示</option></select></label></div>
      </footer>
      <div class="render-status"><span class="status-dot"></span><span id="render-label">准备城市资源</span><span id="fps">— FPS</span><button id="details-button">模型信息 ↗</button></div>
      <button id="jump-button" aria-label="跳跃，快捷键空格">跳跃 <span>SPACE</span></button>
      <div class="keyboard-hint" id="keyboard-hint"><kbd>拖动</kbd> 旋转 <kbd>滚轮</kbd> 缩放 <kbd>右键</kbd> 平移</div>
      <div class="touch-pad" aria-label="触屏移动"><button data-move="forward" aria-label="向前">↑</button><button data-move="left" aria-label="向左">←</button><button data-move="back" aria-label="向后">↓</button><button data-move="right" aria-label="向右">→</button></div>
      <section id="loading" class="loading-overlay" aria-live="polite">
        <div class="loading-card"><div class="loading-kicker">CITY WALK / EXPLORE</div><h2 id="loading-title">正在走近深圳</h2><p id="loading-message">读取原始建筑与材质</p><div class="progress-track"><div id="progress-fill"></div></div><div class="loading-meta"><span id="progress-label">准备资源</span><span>首次进入需要一点时间</span></div><button id="retry-button" hidden>重新加载</button></div>
      </section>
      <dialog id="info-dialog"><button class="dialog-close" aria-label="关闭">×</button><div id="dialog-content"></div></dialog>
      <div id="toast" role="status"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
